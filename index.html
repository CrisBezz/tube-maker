<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#191c22" />
  <title>Mesh Line Replacer v0.8.2</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#111318;color:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{display:grid;place-items:center}.load{padding:24px;text-align:center}.load strong{display:block;font-size:20px;margin-bottom:8px}.err{color:#ff9d9d;white-space:pre-wrap}
  </style>
</head>
<body>
  <div class="load" id="loader"><strong>Mesh Line Replacer v0.8.2</strong>Loading application…</div>
  <script>
  (async()=>{
    const parts=[
      './app-v082/part00.txt',
      './app-v082/part01.txt',
      './app-v082/part02.txt',
      './app-v082/part025.txt',
      './app-v082/part03.txt',
      './app-v082/part04.txt',
      './app-v082/part05.txt',
      './app-v082/part06.txt',
      './app-v082/part07.txt',
      './app-v082/part08.txt'
    ];
    try{
      const text=(await Promise.all(parts.map(async p=>{const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw new Error(`${p}: HTTP ${r.status}`);return r.text()}))).join('');
      document.open();document.write(text);document.close();
    }catch(err){
      document.getElementById('loader').innerHTML='<strong>Unable to load v0.8.2</strong><div class="err"></div>';
      document.querySelector('.err').textContent=String(err?.message||err);
    }
  })();
  </script>
</body>
</html>
