<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#191c22" />
  <title>Mesh Line Replacer v0.8.5</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#111318;color:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{display:grid;place-items:center}.load{padding:24px;text-align:center}.load strong{display:block;font-size:20px;margin-bottom:8px}.err{color:#ff9d9d;white-space:pre-wrap;margin-top:12px}
  </style>
</head>
<body>
  <div class="load" id="loader"><strong>Mesh Line Replacer v0.8.5</strong>Loading static application…</div>
  <script>
  (async()=>{
    const parts=[
      './app-v084-static/part00.txt','./app-v084-static/part01.txt','./app-v084-static/part02.txt','./app-v084-static/part03.txt','./app-v084-static/part04.txt',
      './app-v084-static/part05.txt','./app-v084-static/part06.txt','./app-v084-static/part07.txt','./app-v084-static/part08.txt','./app-v084-static/part09.txt'
    ];
    try{
      const text=(await Promise.all(parts.map(async p=>{
        const r=await fetch(p,{cache:'no-store'});
        if(!r.ok)throw new Error(`${p}: HTTP ${r.status}`);
        return r.text();
      }))).join('');
      document.open();document.write(text);document.close();
    }catch(err){
      const loader=document.getElementById('loader');
      loader.innerHTML='<strong>Unable to load v0.8.5</strong><div class="err"></div>';
      loader.querySelector('.err').textContent=String(err?.stack||err?.message||err);
    }
  })();
  </script>
</body>
</html>
