<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#191c22" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tube Maker" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <title>Faceted Tube Maker</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #f4f5f7; background: #111318; color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; }
    button, input, select { font: inherit; }
    button, .file-button { min-height: 46px; border: 0; border-radius: 12px; padding: 0 14px; color: #fff; background: #2d65f2; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; white-space: nowrap; }
    button.secondary { background: #30343d; }
    button:disabled { opacity: .4; }
    #fileInput { display: none; }
    .app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; }
    .toolbar { display: flex; gap: 8px; align-items: center; padding: max(10px, env(safe-area-inset-top)) 12px 10px; background: #191c22; border-bottom: 1px solid #30343d; overflow-x: auto; }
    .title { font-weight: 800; margin-right: auto; white-space: nowrap; }
    .workspace { min-height: 0; display: grid; grid-template-columns: 1fr 320px; }
    .viewport { position: relative; min-width: 0; background: radial-gradient(circle at 50% 35%, #363c47, #17191f 65%); }
    .viewport canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .hint { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: #c7cad1; pointer-events: none; line-height: 1.5; }
    .hidden { display: none !important; }
    .panel { overflow: auto; padding: 16px; background: #20232a; border-left: 1px solid #30343d; -webkit-overflow-scrolling: touch; }
    .section { margin-bottom: 22px; }
    .section h2 { margin: 0 0 12px; font-size: 13px; text-transform: uppercase; letter-spacing: .09em; color: #aeb4c0; }
    .control { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center; margin-bottom: 13px; }
    .control input[type="range"] { grid-column: 1 / -1; width: 100%; min-height: 30px; }
    .control select, .control input[type="number"] { color: #fff; background: #13161b; border: 1px solid #414754; border-radius: 9px; padding: 10px; max-width: 145px; min-height: 44px; }
    .check { display: flex; align-items: center; gap: 10px; min-height: 44px; }
    .check input { width: 22px; height: 22px; }
    .note { margin: 0; color: #c6cad2; line-height: 1.5; }
    .status { padding: 9px 12px max(9px, env(safe-area-inset-bottom)); background: #191c22; border-top: 1px solid #30343d; color: #b8bdc8; font-size: 13px; display: flex; justify-content: space-between; gap: 12px; }
    @media (max-width: 820px) {
      .title { display: none; }
      .workspace { grid-template-columns: 1fr; grid-template-rows: minmax(48vh, 1fr) auto; overflow: auto; }
      .panel { border-left: 0; border-top: 1px solid #30343d; overflow: visible; }
      .viewport { min-height: 52vh; }
      .status { position: sticky; bottom: 0; }
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<div class="app">
  <header class="toolbar">
    <div class="title">Faceted Tube Maker</div>
    <label class="file-button" for="fileInput">Import model</label>
    <input id="fileInput" type="file" accept=".glb,.gltf,.obj,.stl,model/gltf-binary,model/gltf+json" />
    <button id="exampleBtn" class="secondary">Example</button>
    <button id="generateBtn" disabled>Generate</button>
    <button id="exportBtn" class="secondary" disabled>Export GLB</button>
  </header>
  <main class="workspace">
    <section id="viewport" class="viewport">
      <div id="hint" class="hint"><div><strong>Import a GLB, glTF, OBJ or STL file</strong><br />Your model stays on this iPad.</div></div>
    </section>
    <aside class="panel">
      <div class="section">
        <h2>Source edges</h2>
        <div class="control"><label for="edgeMode">Edge type</label><select id="edgeMode"><option value="sharp">Sharp edges</option><option value="all">All triangle edges</option></select></div>
        <div class="control"><label for="angle">Sharp-edge angle</label><output id="angleOut">30°</output><input id="angle" type="range" min="1" max="120" value="30" /></div>
        <div class="control"><label for="minLength">Minimum length</label><input id="minLength" type="number" min="0" step="0.001" value="0" inputmode="decimal" /></div>
      </div>
      <div class="section">
        <h2>Tube geometry</h2>
        <div class="control"><label for="diameter">Diameter</label><input id="diameter" type="number" min="0.0001" step="0.01" value="0.05" inputmode="decimal" /></div>
        <div class="control"><label for="sides">Facets</label><output id="sidesOut">6</output><input id="sides" type="range" min="3" max="16" value="6" /></div>
        <label class="check"><input id="caps" type="checkbox" checked /> Cap tube ends</label>
        <label class="check"><input id="showSource" type="checkbox" checked /> Show source model</label>
      </div>
      <div class="section">
        <h2>Simple junctions</h2>
        <p class="note">Every edge becomes a separate straight faceted cylinder. Cylinders overlap at corners and branches. There are no welded or mitred junctions.</p>
      </div>
    </aside>
  </main>
  <footer class="status"><span id="status">Ready</span><span id="stats"></span></footer>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const $ = (s) => document.querySelector(s);
const viewport = $('#viewport'), hint = $('#hint'), statusEl = $('#status'), statsEl = $('#stats');
const fileInput = $('#fileInput'), generateBtn = $('#generateBtn'), exportBtn = $('#exportBtn'), exampleBtn = $('#exampleBtn');
const edgeMode = $('#edgeMode'), angle = $('#angle'), angleOut = $('#angleOut'), minLength = $('#minLength');
const diameter = $('#diameter'), sides = $('#sides'), sidesOut = $('#sidesOut'), caps = $('#caps'), showSource = $('#showSource');

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.001, 100000);
camera.position.set(3, 2.2, 3);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
viewport.prepend(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.screenSpacePanning = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 2.2));
const keyLight = new THREE.DirectionalLight(0xffffff, 2.5);
keyLight.position.set(4, 7, 5);
scene.add(keyLight);
const grid = new THREE.GridHelper(10, 20, 0x697180, 0x3c424c);
scene.add(grid);

let sourceRoot = null;
let tubeRoot = null;
let sourceName = 'faceted-tubes';

function setStatus(message) { statusEl.textContent = message; }
function disposeObject(root) {
  if (!root) return;
  root.traverse((obj) => {
    if (obj.geometry) obj.geometry.dispose?.();
    const mat = obj.material;
    if (Array.isArray(mat)) mat.forEach((m) => m.dispose?.()); else mat?.dispose?.();
  });
  root.removeFromParent();
}
function fitCamera(object) {
  const box = new THREE.Box3().setFromObject(object);
  const sphere = box.getBoundingSphere(new THREE.Sphere());
  if (!Number.isFinite(sphere.radius) || sphere.radius <= 0) return;
  controls.target.copy(sphere.center);
  camera.near = Math.max(sphere.radius / 1000, 0.001);
  camera.far = Math.max(sphere.radius * 100, 100);
  camera.position.copy(sphere.center).add(new THREE.Vector3(1.5, 1.1, 1.5).normalize().multiplyScalar(sphere.radius * 3));
  camera.updateProjectionMatrix();
  controls.update();
  grid.scale.setScalar(Math.max(sphere.radius, 1));
  grid.position.y = box.min.y;
}
function normaliseImported(root) {
  const group = new THREE.Group();
  root.updateMatrixWorld(true);
  root.traverse((obj) => {
    if (!obj.isMesh || !obj.geometry) return;
    const geometry = obj.geometry.clone();
    geometry.applyMatrix4(obj.matrixWorld);
    if (!geometry.attributes.normal) geometry.computeVertexNormals();
    const material = new THREE.MeshStandardMaterial({ color: 0x9ba5b4, roughness: 0.75, metalness: 0.05, side: THREE.DoubleSide, transparent: true, opacity: 0.42 });
    group.add(new THREE.Mesh(geometry, material));
  });
  return group;
}
async function loadFile(file) {
  setStatus(`Loading ${file.name}…`);
  sourceName = file.name.replace(/\.[^.]+$/, '') || 'faceted-tubes';
  const url = URL.createObjectURL(file);
  try {
    const ext = file.name.split('.').pop()?.toLowerCase();
    let loaded;
    if (ext === 'glb' || ext === 'gltf') loaded = (await new GLTFLoader().loadAsync(url)).scene;
    else if (ext === 'obj') loaded = await new OBJLoader().loadAsync(url);
    else if (ext === 'stl') loaded = new THREE.Mesh(await new STLLoader().loadAsync(url));
    else throw new Error('Unsupported file format.');
    setSource(normaliseImported(loaded));
    setStatus(`${file.name} loaded`);
  } finally { URL.revokeObjectURL(url); }
}
function setSource(group) {
  disposeObject(sourceRoot); disposeObject(tubeRoot);
  tubeRoot = null; sourceRoot = group; scene.add(group); fitCamera(group);
  hint.classList.add('hidden'); generateBtn.disabled = false; exportBtn.disabled = true; updateStats();
}
function addEdge(map, a, b) {
  const keyFor = (v) => `${v.x.toPrecision(9)},${v.y.toPrecision(9)},${v.z.toPrecision(9)}`;
  const ka = keyFor(a), kb = keyFor(b), key = ka < kb ? `${ka}|${kb}` : `${kb}|${ka}`;
  if (!map.has(key)) map.set(key, [a.clone(), b.clone()]);
}
function collectEdges() {
  if (!sourceRoot) return [];
  const edges = new Map();
  sourceRoot.updateMatrixWorld(true);
  sourceRoot.traverse((obj) => {
    if (!obj.isMesh) return;
    const edgeGeo = edgeMode.value === 'sharp' ? new THREE.EdgesGeometry(obj.geometry, Number(angle.value)) : new THREE.WireframeGeometry(obj.geometry);
    const p = edgeGeo.getAttribute('position');
    for (let i = 0; i < p.count; i += 2) {
      const a = new THREE.Vector3().fromBufferAttribute(p, i).applyMatrix4(obj.matrixWorld);
      const b = new THREE.Vector3().fromBufferAttribute(p, i + 1).applyMatrix4(obj.matrixWorld);
      if (a.distanceTo(b) >= Number(minLength.value || 0)) addEdge(edges, a, b);
    }
    edgeGeo.dispose();
  });
  return [...edges.values()];
}
function cylinderForEdge(a, b) {
  const length = a.distanceTo(b);
  const geometry = new THREE.CylinderGeometry(Number(diameter.value) / 2, Number(diameter.value) / 2, length, Number(sides.value), 1, !caps.checked);
  const midpoint = a.clone().add(b).multiplyScalar(0.5);
  const direction = b.clone().sub(a).normalize();
  geometry.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction));
  geometry.translate(midpoint.x, midpoint.y, midpoint.z);
  return geometry;
}
async function generateTubes() {
  if (!sourceRoot) return;
  generateBtn.disabled = true; setStatus('Finding edges…');
  await new Promise((resolve) => requestAnimationFrame(resolve));
  try {
    const edges = collectEdges();
    if (!edges.length) { setStatus('No eligible edges found'); return; }
    if (edges.length > 50000 && !confirm(`This model has ${edges.length.toLocaleString()} edges. It may be slow or exceed iPad memory. Continue?`)) { setStatus('Generation cancelled'); return; }
    setStatus(`Generating ${edges.length.toLocaleString()} tubes…`);
    await new Promise((resolve) => requestAnimationFrame(resolve));
    disposeObject(tubeRoot);
    tubeRoot = new THREE.Group();
    const material = new THREE.MeshStandardMaterial({ color: 0xe6b85c, roughness: 0.58, metalness: 0.08, flatShading: true });
    const batchSize = 1000;
    for (let start = 0; start < edges.length; start += batchSize) {
      const geometries = edges.slice(start, start + batchSize).map(([a, b]) => cylinderForEdge(a, b));
      const merged = mergeGeometries(geometries, false);
      geometries.forEach((g) => g.dispose());
      if (merged) tubeRoot.add(new THREE.Mesh(merged, material));
      if (start % 5000 === 0) { setStatus(`Generating… ${Math.min(start + batchSize, edges.length).toLocaleString()} / ${edges.length.toLocaleString()}`); await new Promise((resolve) => requestAnimationFrame(resolve)); }
    }
    scene.add(tubeRoot); sourceRoot.visible = showSource.checked; exportBtn.disabled = false;
    setStatus(`Generated ${edges.length.toLocaleString()} separate tubes`); updateStats(edges.length);
  } catch (error) { console.error(error); setStatus(`Generation failed: ${error.message || error}`); }
  finally { generateBtn.disabled = false; }
}
function exportGlb() {
  if (!tubeRoot) return;
  exportBtn.disabled = true; setStatus('Preparing GLB…');
  new GLTFExporter().parse(tubeRoot, (result) => {
    const blob = new Blob([result], { type: 'model/gltf-binary' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `${sourceName}-tubes.glb`; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 3000); setStatus('GLB exported'); exportBtn.disabled = false;
  }, (error) => { console.error(error); setStatus(`Export failed: ${error.message || error}`); exportBtn.disabled = false; }, { binary: true, onlyVisible: true });
}
function makeExample() {
  const group = new THREE.Group(); group.add(new THREE.Mesh(new THREE.IcosahedronGeometry(1, 1)));
  sourceName = 'icosahedron'; setSource(normaliseImported(group)); setStatus('Example model loaded');
}
function updateStats(tubeCount) {
  let sourceTriangles = 0;
  sourceRoot?.traverse((obj) => { if (obj.isMesh) sourceTriangles += obj.geometry.index ? obj.geometry.index.count / 3 : obj.geometry.getAttribute('position').count / 3; });
  statsEl.textContent = `${Math.round(sourceTriangles).toLocaleString()} triangles${tubeCount == null ? '' : ` • ${tubeCount.toLocaleString()} tubes`}`;
}
fileInput.addEventListener('change', () => { const file = fileInput.files?.[0]; if (file) loadFile(file).catch((e) => { console.error(e); setStatus(`Load failed: ${e.message || e}`); }); fileInput.value = ''; });
exampleBtn.addEventListener('click', makeExample);
generateBtn.addEventListener('click', generateTubes);
exportBtn.addEventListener('click', exportGlb);
showSource.addEventListener('change', () => { if (sourceRoot) sourceRoot.visible = showSource.checked; });
angle.addEventListener('input', () => angleOut.value = `${angle.value}°`);
sides.addEventListener('input', () => sidesOut.value = sides.value);
function resize() { const w = viewport.clientWidth, h = viewport.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / Math.max(h, 1); camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(viewport); resize();
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(console.warn));
</script>
</body>
</html>
