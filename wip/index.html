<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#191c22" />
  <title>Mesh Line Replacer v0.8.7-wip.1</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#111318;color:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{display:grid;place-items:center}.load{padding:24px;text-align:center}.load strong{display:block;font-size:20px;margin-bottom:8px}.err{color:#ff9d9d;white-space:pre-wrap;margin-top:12px}
  </style>
</head>
<body>
  <div class="load" id="loader"><strong>Mesh Line Replacer v0.8.7-wip.1</strong>Loading isolated WIP build…</div>
  <script>
  (async()=>{
    const base='./app-v086-static/';
    const stableParts=['part00.txt','part01.txt','part02.txt','part03.txt','part04.txt','part05.txt','part06.txt','part07.txt','part08.txt','part09.txt'];
    try{
      const [parts, extension, groupedPatch] = await Promise.all([
        Promise.all(stableParts.map(async name=>{
          const r=await fetch(base+name+'?v=0.8.7-wip.1',{cache:'no-store'});
          if(!r.ok)throw new Error(`${name}: HTTP ${r.status}`);
          return r.text();
        })),
        fetch(base+'part08b.txt?v=0.8.7-wip.1',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`part08b.txt: HTTP ${r.status}`);return r.text();}),
        fetch('./app-v087-static/grouped-instances.txt?v=0.8.7-wip.1',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`grouped-instances.txt: HTTP ${r.status}`);return r.text();})
      ]);
      let text=parts.join('');
      const marker="fileInput.addEventListener('change', () => {";
      const at=text.indexOf(marker);
      if(at<0)throw new Error('WIP insertion point not found');
      text=text.slice(0,at)+extension+'\n\n'+groupedPatch+'\n\n'+text.slice(at);
      document.open();document.write(text);document.close();
    }catch(err){
      const loader=document.getElementById('loader');
      loader.innerHTML='<strong>Unable to load WIP build</strong><div class="err"></div>';
      loader.querySelector('.err').textContent=String(err?.stack||err?.message||err);
    }
  })();
  </script>
</body>
</html>
